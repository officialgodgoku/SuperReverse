name: Multi-Platform Release Build (Windows, macOS, Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run Smoke Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_smoke.py

      - name: Build Standalone Single-File Windows Executable
        shell: pwsh
        env:
          ONEFILE: "1"
        run: pyinstaller SuperReverse.spec --noconfirm

      - name: Rename & Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperReverse-Windows-Portable
          path: dist/SuperReverse.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt pyinstaller pytest

      - name: Run Smoke Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_smoke.py

      - name: Build macOS App Bundle
        run: pyinstaller SuperReverse.spec --noconfirm

      - name: Create macOS Zip Archive
        run: |
          cd dist
          zip -r SuperReverse-macOS.zip SuperReverse.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperReverse-macOS
          path: dist/SuperReverse-macOS.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt pyinstaller pytest

      - name: Run Smoke Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_smoke.py

      - name: Build Linux Binary
        run: pyinstaller SuperReverse.spec --noconfirm

      - name: Package Linux Tarball
        run: |
          cd dist
          tar -czvf SuperReverse-Linux-x86_64.tar.gz superreverse/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperReverse-Linux
          path: dist/SuperReverse-Linux-x86_64.tar.gz

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperReverse-Windows-Portable
          path: release-assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperReverse-macOS
          path: release-assets/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperReverse-Linux
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
